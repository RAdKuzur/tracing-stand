<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход в систему трассировки</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-box">
    <h1>Вход в систему трассировки</h1>
    <p class="hint">Выберите пользователя. Пароль не требуется в MVP.</p>

    <form id="login-form">
      <label>
        Пользователь
        <select id="username" required>
          <option value="">— выберите —</option>
        </select>
      </label>

      <div id="role-info" class="role-info" hidden>
        <div>Роль: <b id="role-name"></b></div>
        <div>Права: <span id="role-rights"></span></div>
      </div>

      <button type="submit">Войти</button>
      <div id="error" class="error" hidden></div>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
