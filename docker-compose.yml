version: "3.8"

services:
  service-a:
    build:
      context: ./service-a
    container_name: service-a
    ports:
      - "8081:8081"
    networks:
      - tracing-net
    depends_on:
      - service-b
      - trace-collector

  service-b:
    build:
      context: ./service-b
    container_name: service-b
    ports:
      - "8082:8082"
    networks:
      - tracing-net
    depends_on:
      - trace-collector

  trace-collector:
    build:
      context: ./trace-collector
    container_name: trace-collector
    ports:
      - "4318:4318"
    volumes:
      - trace-data:/data
    networks:
      - tracing-net

  trace-ui:
    build: ./trace-ui
    container_name: trace-ui
    ports:
      - "${UI_PORT}:8080"
    environment:
      - COLLECTOR_URL=http://trace-collector:4318
      - UI_PORT=8080
    depends_on:
      - trace-collector
    networks:
      - tracing-net
networks:
  tracing-net:
    driver: bridge

volumes:
  trace-data: