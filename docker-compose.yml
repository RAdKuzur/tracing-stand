services:
  # ============================================================
  # Go-микросервис A (инициатор запроса)
  # ============================================================
  service-a:
    build: ./service-a
    container_name: service-a
    ports:
      - "${SERVICE_A_PORT:-8081}:8081"
    environment:
      - COLLECTOR_URL=http://trace-collector:4318/v1/traces
      - SERVICE_B_URL=http://service-b:8082/work
    depends_on:
      service-b:
        condition: service_started
      trace-collector:
        condition: service_healthy
    networks:
      - tracing-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "2", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================
  # Go-микросервис B (получатель вызова)
  # ============================================================
  service-b:
    build: ./service-b
    container_name: service-b
    ports:
      - "${SERVICE_B_PORT:-8082}:8082"
    environment:
      - COLLECTOR_URL=http://trace-collector:4318/v1/traces
    depends_on:
      trace-collector:
        condition: service_healthy
    networks:
      - tracing-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "2", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================
  # Python-коллектор (OTLP/HTTP + SQLite + аудит + маскирование)
  # Наружу НЕ публикуется: доступ только через trace-ui
  # ============================================================
  trace-collector:
    build: ./trace-collector
    container_name: trace-collector
    ports:
      - "4318:4318"
    environment:
      - SPAN_DB_PATH=/data/spans.db
      - AUDIT_LOG_PATH=/data/audit.jsonl
      - MASKING_RULES_PATH=/app/config/masking_rules.json
      - COLLECTOR_PORT=4318
    volumes:
      - trace-data:/data
    networks:
      - tracing-net
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:4318/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============================================================
  # Python-UI (статика + прокси + auth/RBAC)
  # ============================================================
  trace-ui:
    build: ./trace-ui
    container_name: trace-ui
    ports:
      - "${UI_PORT:-8080}:8080"
    environment:
      - COLLECTOR_URL=http://trace-collector:4318
      - UI_PORT=8080
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me}
      - USERS_PATH=/app/config/users.json
    volumes:
      - ./trace-ui/config:/app/config:ro
    depends_on:
      trace-collector:
        condition: service_healthy
    networks:
      - tracing-net
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/login.html', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s


  tests-collector:
    build:
      context: ./trace-collector
      dockerfile: Dockerfile.test
    container_name: tests-collector
    volumes:
      - ./trace-collector:/app
    command:
      - "pytest"
      - "--cov=src"
      - "--cov-report=term-missing"
      - "--cov-fail-under=75"
    networks:
      - tracing-net
    profiles: ["tests"]

  tests-ui:
    build:
      context: ./trace-ui
      dockerfile: Dockerfile.test
    container_name: tests-ui
    volumes:
      - ./trace-ui:/app
    environment:
      - SESSION_SECRET=test-secret
    command: ["pytest", "-v"]
    networks:
      - tracing-net
    profiles: ["tests"]

networks:
  tracing-net:
    driver: bridge

volumes:
  trace-data: