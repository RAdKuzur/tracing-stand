services:
  service-a:
    build: ./service-a
    container_name: service-a
    ports:
      - "${SERVICE_A_PORT}:8081"
    depends_on:
      service-b:
        condition: service_started
      trace-collector:
        condition: service_healthy
    networks:
      - tracing-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "2", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  service-b:
    build: ./service-b
    container_name: service-b
    ports:
      - "${SERVICE_B_PORT}:8082"
    depends_on:
      trace-collector:
        condition: service_healthy
    networks:
      - tracing-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "2", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  trace-collector:
    build: ./trace-collector
    container_name: trace-collector
    ports:
      - "${COLLECTOR_PORT}:4318"
    environment:
      - SPAN_DB_PATH=/data/spans.db
      - AUDIT_LOG_PATH=/data/audit.jsonl
      - MASKING_RULES_PATH=/app/config/masking_rules.json
      - COLLECTOR_PORT=4318
    volumes:
      - trace-data:/data
    networks:
      - tracing-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4318/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  trace-ui:
    build: ./trace-ui
    container_name: trace-ui
    ports:
      - "${UI_PORT}:8080"
    environment:
      - COLLECTOR_URL=http://trace-collector:4318
      - UI_PORT=8080
    depends_on:
      trace-collector:
        condition: service_healthy
    networks:
      - tracing-net

networks:
  tracing-net:
    driver: bridge

volumes:
  trace-data: